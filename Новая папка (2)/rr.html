<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DaKri - Отзыв</title>
    <style>
        /* Сброс стилей и базовые настройки */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121614; /* Темный фон, как на фото */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
        }

        /* Контейнер карточки */
        .card {
            background-color: #1e2321; /* Чуть более светлый фон карточки */
            border: 1px solid #2d3431;
            border-radius: 20px;
            width: 90%;
            max-width: 380px;
            padding: 40px 20px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Верхние точки */
        .dots {
            color: #6d7a74;
            letter-spacing: 8px;
            font-size: 24px;
            margin-bottom: 15px;
            line-height: 1;
        }

        /* Заголовок */
        h1 {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        /* Текст описания */
        p {
            color: #9ba8a3;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        /* Кнопка */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #d4a373, #d9b48f);
            color: #2b2b2b;
            text-decoration: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 25px;
            transition: transform 0.2s, filter 0.2s;
            box-shadow: 0 4px 15px rgba(212, 163, 115, 0.2);
        }

        .btn:active {
            transform: scale(0.98);
            filter: brightness(0.95);
        }

        /* Иконка внутри кнопки */
        .btn svg {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            fill: currentColor;
        }

        /* Нижний текст */
        .footer-text {
            color: #6d7a74;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .footer-text svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Декоративные точки сверху -->
        <div class="dots">•••</div>

        <!-- Заголовок -->
        <h1>DaKri</h1>

        <!-- Подзаголовок -->
        <p>Будем благодарны за ваш отзыв.<br>Выберите удобный сервис</p>

        <!-- Кнопка 2ГИС -->
        <a href="https://2gis.ru/barnaul/geo/70000001112732687?inv_by=4d2de64f143e40648a9eebf25a6bd746&inv_ts=1793519363" class="btn" target="_blank">
            <!-- Иконка метки 2ГИС -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
            </svg>
            2ГИС
        </a>

        <!-- Подпись внизу -->
        <div class="footer-text">
            <span>Спасибо, что помогаете нам становиться лучше</span>
            <!-- Иконка сердечка -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </div>
    </div>

</body>
</html>
